<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level Editor — AI-TTRPG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; }
    .scroll::-webkit-scrollbar { width: 6px; }
    .scroll::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 3px; }
    textarea#ed-json { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; line-height: 1.4; tab-size: 2; }
    .ed-group-label { letter-spacing: .08em; }
    .ed-entity-row.selected { background: #1e3a5f; border-color: #3b82f6; }
    .ed-exit-row input { min-width: 0; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <div class="max-w-7xl mx-auto p-4 flex flex-col gap-4 h-screen" style="max-height:100vh;">

    <!-- Top bar -->
    <div class="flex items-center justify-between bg-gray-900 rounded-lg border border-gray-700 px-4 py-2 shrink-0">
      <div class="flex items-center gap-3">
        <span class="text-lg font-bold tracking-wide text-amber-300">⟁ Level Editor</span>
        <span id="ed-conn" class="text-sm text-gray-500">connecting…</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="ed-spawn" class="text-sm font-medium py-1.5 px-4 rounded transition-colors bg-blue-600 hover:bg-blue-500 text-white">
          + Spawn entity
        </button>
        <button id="ed-despawn" class="text-sm font-medium py-1.5 px-4 rounded transition-colors bg-red-900/70 hover:bg-red-800 text-red-100 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
          Despawn selected
        </button>
      </div>
    </div>

    <div class="grid grid-cols-12 gap-4 flex-1 min-h-0">

      <!-- LEFT: entity list grouped by kind -->
      <div class="col-span-3 bg-gray-900 rounded-lg border border-gray-700 p-3 flex flex-col min-h-0">
        <h3 class="text-xs uppercase tracking-wider text-gray-500 mb-2 ed-group-label">Entities</h3>
        <div id="ed-entity-list" class="flex-1 overflow-y-auto scroll flex flex-col gap-2 text-sm"></div>
      </div>

      <!-- MIDDLE: JSON editor for selected entity -->
      <div class="col-span-6 bg-gray-900 rounded-lg border border-gray-700 p-3 flex flex-col min-h-0">
        <div class="flex items-center justify-between mb-2 shrink-0">
          <h3 class="text-xs uppercase tracking-wider text-gray-500 ed-group-label">Selected — <span id="ed-selected-id" class="text-amber-300 normal-case tracking-normal">none</span></h3>
          <button id="ed-apply" class="text-sm font-medium py-1 px-3 rounded bg-emerald-700 hover:bg-emerald-600 text-white disabled:opacity-40 disabled:cursor-not-allowed" disabled>
            Apply
          </button>
        </div>
        <textarea id="ed-json" class="flex-1 min-h-0 w-full bg-black/40 border border-gray-700 rounded p-3 text-gray-100 resize-none focus:outline-none focus:border-blue-500" placeholder="Select an entity to edit its components as JSON…" spellcheck="false" disabled></textarea>
        <div id="ed-status" class="text-xs text-gray-500 mt-1 shrink-0 min-h-[1em]"></div>
      </div>

      <!-- RIGHT: location graph (place.connections) for selected location -->
      <div class="col-span-3 bg-gray-900 rounded-lg border border-gray-700 p-3 flex flex-col min-h-0 gap-2">
        <h3 class="text-xs uppercase tracking-wider text-gray-500 ed-group-label">Location graph</h3>
        <div id="ed-graph-empty" class="text-sm text-gray-600 italic">Select a location to edit its exits.</div>
        <div id="ed-graph" class="hidden flex flex-col gap-2 min-h-0 flex-1">
          <div id="ed-exit-list" class="flex flex-col gap-1.5 overflow-y-auto scroll flex-1 min-h-0 text-sm"></div>
          <div class="border-t border-gray-800 pt-2 flex flex-col gap-1.5">
            <div class="text-xs text-gray-500">Add exit</div>
            <div class="flex gap-1.5 ed-exit-row">
              <input id="ed-exit-target" type="text" placeholder="targetId" class="bg-black/40 border border-gray-700 rounded px-2 py-1 text-sm w-1/3 focus:outline-none focus:border-blue-500" />
              <input id="ed-exit-label" type="text" placeholder="label" class="bg-black/40 border border-gray-700 rounded px-2 py-1 text-sm w-1/3 focus:outline-none focus:border-blue-500" />
              <input id="ed-exit-distance" type="text" placeholder="distance?" class="bg-black/40 border border-gray-700 rounded px-2 py-1 text-sm w-1/4 focus:outline-none focus:border-blue-500" />
            </div>
            <button id="ed-exit-add" class="text-sm font-medium py-1 px-3 rounded bg-blue-700 hover:bg-blue-600 text-white">Add exit</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Spawn overlay -->
  <div id="ed-spawn-overlay" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50" style="display:none;">
    <div class="bg-gray-900 border border-gray-700 rounded-lg p-4 w-[min(90vw,40rem)] flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-semibold text-amber-300">Spawn entity</h3>
        <button id="ed-spawn-close" class="text-gray-500 hover:text-gray-300 text-sm">✕</button>
      </div>
      <div class="flex items-center gap-2 text-sm">
        <label for="ed-spawn-kind" class="text-gray-400">Template:</label>
        <select id="ed-spawn-kind" class="bg-black/40 border border-gray-700 rounded px-2 py-1 text-sm">
          <option value="location">location</option>
          <option value="npc">npc</option>
          <option value="item">item</option>
          <option value="quest">quest</option>
          <option value="faction">faction</option>
          <option value="pc">pc</option>
        </select>
      </div>
      <textarea id="ed-spawn-json" class="w-full h-64 bg-black/40 border border-gray-700 rounded p-3 text-gray-100 font-mono text-sm resize-none focus:outline-none focus:border-blue-500" spellcheck="false"></textarea>
      <div id="ed-spawn-status" class="text-xs text-gray-500 min-h-[1em]"></div>
      <div class="flex justify-end gap-2">
        <button id="ed-spawn-cancel" class="text-sm py-1.5 px-3 rounded border border-gray-700 text-gray-300 hover:bg-gray-800">Cancel</button>
        <button id="ed-spawn-confirm" class="text-sm py-1.5 px-3 rounded bg-blue-600 hover:bg-blue-500 text-white">Spawn</button>
      </div>
    </div>
  </div>

  <script type="module" src="/editor.js"></script>
</body>
</html>
