<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMView — AI-TTRPG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .scroll::-webkit-scrollbar { width: 6px; }
    .scroll::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 3px; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <div class="max-w-7xl mx-auto p-4 flex flex-col gap-4 h-screen" style="max-height:100vh;">

    <!-- Top bar -->
    <div class="flex items-center justify-between bg-gray-900 rounded-lg border border-gray-700 px-4 py-2 shrink-0">
      <div class="flex items-center gap-3">
        <span class="text-lg font-bold tracking-wide text-amber-300">DMView</span>
        <span id="dm-conn" class="text-xs text-gray-500">connecting…</span>
      </div>
      <button id="dm-autopilot"
        class="text-sm font-medium py-1.5 px-4 rounded transition-colors bg-gray-700 text-gray-200">
        Autopilot: …
      </button>
    </div>

    <div class="grid grid-cols-12 gap-4 flex-1 min-h-0">
      <!-- Left: THE STORY (what players read) + stage-a-beat authoring -->
      <div class="col-span-5 flex flex-col gap-4 min-h-0">
        <div class="bg-gray-900 rounded-lg border border-gray-700 p-3 flex flex-col min-h-0 flex-1">
          <h3 class="text-xs uppercase tracking-wider text-gray-500 mb-2">Story — what the players see</h3>
          <div id="dm-story" class="flex-1 overflow-y-auto scroll text-sm min-h-0"></div>
        </div>
        <div class="bg-gray-900 rounded-lg border border-indigo-900/60 p-3 shrink-0">
          <h3 class="text-xs uppercase tracking-wider text-indigo-400/80 mb-2">Stage a beat — you author the next ruling</h3>
          <div id="dm-stage" class="flex flex-col gap-1.5"></div>
        </div>
      </div>

      <!-- Middle: proposals + agent activity -->
      <div class="col-span-4 flex flex-col gap-4 min-h-0">
        <div class="bg-gray-900 rounded-lg border border-gray-700 p-3 flex flex-col min-h-0 flex-1">
          <h3 class="text-xs uppercase tracking-wider text-gray-500 mb-2">Proposals</h3>
          <div id="dm-proposals" class="flex flex-col gap-2 overflow-y-auto scroll"></div>
        </div>
        <div class="bg-gray-900 rounded-lg border border-gray-700 p-3 flex flex-col min-h-0 flex-1">
          <h3 class="text-xs uppercase tracking-wider text-gray-500 mb-2">Agent activity</h3>
          <div id="dm-traces" class="flex flex-col gap-1 overflow-y-auto scroll text-sm"></div>
        </div>
      </div>

      <!-- Right: turn order + entity inspector -->
      <div class="col-span-3 flex flex-col gap-4 min-h-0">
        <div class="bg-gray-900 rounded-lg border border-gray-700 p-3 shrink-0 max-h-[45%] overflow-y-auto scroll">
          <h3 class="text-xs uppercase tracking-wider text-gray-500 mb-2">Turn order</h3>
          <div id="dm-turnorder" class="flex flex-col gap-1 text-sm"></div>
        </div>
        <div class="bg-gray-900 rounded-lg border border-gray-700 p-3 flex flex-col min-h-0 flex-1">
          <h3 class="text-xs uppercase tracking-wider text-gray-500 mb-2">Entities (full)</h3>
          <div id="dm-entities" class="flex flex-col gap-0.5 overflow-y-auto scroll text-sm"></div>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="/dm.js"></script>
</body>
</html>
